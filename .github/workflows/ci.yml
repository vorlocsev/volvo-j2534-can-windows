name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Pin .NET SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "8.0.425",
              "rollForward": "latestPatch",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content -Encoding utf8 global.json

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore VolvoJ2534.sln

      - name: Build
        run: dotnet build VolvoJ2534.sln --configuration Release --no-restore -p:Platform=x86

      - name: Publish
        run: dotnet publish src/VolvoJ2534.App/VolvoJ2534.App.csproj --configuration Release --no-restore --self-contained true --runtime win-x86 -p:Platform=x86 --output artifacts/app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolvoJ2534-Windows-x86
          path: artifacts/app
